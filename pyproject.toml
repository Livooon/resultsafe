[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "resultsafe"
version = "0.1.0"
description = "Typed immutable Result and Option values for Python"
readme = "packages/python/README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "hypothesis==6.165.10",
  "mypy==1.18.2",
  "build==1.3.0",
]

[tool.setuptools]
package-dir = {"" = "packages/python/src"}

[tool.setuptools.packages.find]
where = ["packages/python/src"]

[tool.setuptools.package-data]
resultsafe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
  "packages/python/tests",
]
pythonpath = [
  "packages/python/src",
  ".",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = [
  "packages/python/src",
  "packages/python/typing/positive.py",
]

name: Promote Qualified Result Candidate

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful CI Qualification workflow run ID
        required: true
        type: string
      candidate_id:
        description: Candidate ID emitted by that run
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of candidate-manifest.json
        required: true
        type: string
      tarball_sha256:
        description: SHA-256 of the exact npm tarball
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-result-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: npm-production
    steps:
      - name: Checkout protected promotion verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate selected qualification run
        id: qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: node tools/release/candidate.mjs verify-run "--run-id=$QUALIFICATION_RUN_ID"
      - name: Checkout exact qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.qualification.outputs.source_sha }}
      - name: Download explicitly selected qualified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-${{ inputs.candidate_id }}
          path: .resultsafe-candidates/promotion
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate identity, manifest, SBOM, provenance, and exact bytes
        id: verify
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
          SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
        run: >-
          node tools/release/candidate.mjs verify
          --directory=.resultsafe-candidates/promotion
          "--candidate-id=$CANDIDATE_ID"
           "--manifest-sha256=$MANIFEST_SHA256"
           "--tarball-sha256=$TARBALL_SHA256"
           "--source-sha=$SOURCE_SHA"
      - name: Verify qualification evidence matches candidate and run
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          SOURCE_SHA: ${{ steps.qualification.outputs.source_sha }}
          RUN_EVENT: ${{ steps.qualification.outputs.run_event }}
          RUN_ATTEMPT: ${{ steps.qualification.outputs.run_attempt }}
        run: >-
          node tools/release/candidate.mjs verify-qualification
          --directory=.resultsafe-candidates/promotion
          "--candidate-id=$CANDIDATE_ID" "--run-id=$QUALIFICATION_RUN_ID"
          "--source-sha=$SOURCE_SHA" "--event=$RUN_EVENT" "--run-attempt=$RUN_ATTEMPT"
      - name: Enforce exact governed Result release before publish
        run: node tools/release/check-allowlist.mjs @resultsafe/core-fp-result 0.3.0
      - name: Publish the verified tarball without rebuilding
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.verify.outputs.tarball }}" --access public --provenance
